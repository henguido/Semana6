name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Instalar dependencias desde el lockfile
        run: npm ci

      - name: Ejecutar la puerta de verificación (verificar.sh)
        run: bash verificar.sh
